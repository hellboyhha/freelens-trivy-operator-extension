name: Feature request
description: An idea to make the extension more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the task, not only the feature. What is hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
